name: Build PearlHash WildRig 0.51.3 Canary

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable candidate tag
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/salad-prl-pearlhash-wildrig:v0.51.3-canary-${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Build locally without push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wildrig-0513-canary
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: Smoke binary SHA, flags, continuous life, telemetry and TERM with fake miner
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sha256sum "$IMAGE" /opt/wildrig/wildrig-multi | tee /tmp/wildrig-hash
          grep -Fx '43c69d341fadbcdba3553b1b22d3a8847ae4d4fabf66c4833515e3e33f2a1244  /opt/wildrig/wildrig-multi' /tmp/wildrig-hash
          docker run --rm --entrypoint sh -v "$PWD/tests/wildrig-0512-fake-miner.sh:/tmp/fake:ro" \
            -e WILDRIG_TEST_MODE=1 -e WILDRIG_TEST_BINARY=/tmp/fake \
            -e PRL_WALLET=dummy -e PRL_POOL_URL=pool.invalid:9000 -e PRL_WORKER=smoke \
            -e BURNIN_SECONDS=0 -e MINER_TELEMETRY_INTERVAL=1 "$IMAGE" -c '
              set -eu
              set +e
              timeout --signal=TERM --kill-after=3s 2s /usr/local/bin/prl-burnin-entrypoint > /tmp/wildrig-out 2>&1
              code=$?
              set -e
              test "$code" -eq 124
              test -f /tmp/wildrig-term
              grep -Fxq fifo /tmp/wildrig-stdin-kind
              grep -Fxq -- --gpu-list /tmp/wildrig-args
              grep -Fxq -- 0 /tmp/wildrig-args
              grep -Fxq -- --user /tmp/wildrig-args
              grep -Fxq -- dummy /tmp/wildrig-args
              grep -Fxq -- --worker /tmp/wildrig-args
              grep -Fxq -- smoke /tmp/wildrig-args
              ! grep -Fxq -- dummy.smoke /tmp/wildrig-args
              ! grep -Fq -- --opencl-devices /tmp/wildrig-args
              grep -Fq "\"event\":\"miner_start\"" /tmp/wildrig-out
              grep -Fq "\"event\":\"miner_telemetry\"" /tmp/wildrig-out
              echo "FIFO stdin, fake flags, continuous mode, telemetry and TERM: ok"
            '
      - name: Publish only after smoke passes
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published: ghcr.io/${{ github.repository_owner }}/salad-prl-pearlhash-wildrig@$digest" >> "$GITHUB_STEP_SUMMARY"
